[project]
name = "quant-research"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dewyfiower9440-hash", email = "256257058+dewyfiower9440-hash@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numba>=0.68.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "websockets>=17.4",
]

[project.scripts]
quant-research = "quant_research:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
# The editor format hook runs ruff from outside the project; without this it classifies the
# package as third-party and fights the project gate over import grouping.
known-first-party = ["quant_research"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
